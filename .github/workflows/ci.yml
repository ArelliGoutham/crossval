name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: mongodb://localhost:27018/?replicaSet=rs0
      MONGODB_DB_NAME: crossval_ci
      APP_ORIGIN: http://localhost:3000
      SESSION_TTL_DAYS: '7'
      BCRYPT_COST: '12'
      BCRYPT_DUMMY_HASH: '$2b$12$6pXXnmXUHS4PXpEO6JeKFuq/7/7myFbHw9ZouzgxJK1YLAUNhx4wa'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo \
            -p 27018:27017 \
            mongo:7 \
            mongod --replSet rs0 --bind_ip_all

          sleep 3

          docker exec mongo mongosh --quiet --eval '
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "localhost:27017" }]
            })
          '

          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'rs.status().ok' 2>/dev/null | grep -q '1'; then
              echo "MongoDB replica set is ready"
              break
            fi
            echo "Waiting for MongoDB replica set... ($i/30)"
            sleep 2
          done

          docker exec mongo mongosh --quiet --eval 'rs.status().ok' || exit 1

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e
