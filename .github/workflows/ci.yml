name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27018:27017
        env:
          MONGO_INITDB_REPLICA_SET_NAME: rs0
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1}).ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27018/?replicaSet=rs0
      MONGODB_DB_NAME: crossval_ci
      APP_ORIGIN: http://localhost:3000
      SESSION_TTL_DAYS: '7'
      BCRYPT_COST: '12'
      BCRYPT_DUMMY_HASH: '$2b$12$6pXXnmXUHS4PXpEO6JeKFuq/7/7myFbHw9ZouzgxJK1YLAUNhx4wa'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize and wait for MongoDB replica set
        run: |
          node -e "
            const { MongoClient } = require('mongodb');
            const uri = 'mongodb://localhost:27018/?replicaSet=rs0';
            const directUri = 'mongodb://localhost:27018';

            (async () => {
              const client = new MongoClient(directUri, { directConnection: true });
              try {
                await client.connect();
                const admin = client.db('admin');
                try {
                  await admin.command({ replSetInitiate: { _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] } });
                  console.log('Replica set initiated');
                } catch (e) {
                  console.log('Replica set may already be initiated:', e.message);
                }
              } finally {
                await client.close();
              }

              for (let i = 0; i < 30; i++) {
                try {
                  const rsClient = new MongoClient(uri, { directConnection: true, serverSelectionTimeoutMS: 2000 });
                  await rsClient.connect();
                  const result = await rsClient.db('admin').command({ replSetGetStatus: 1 });
                  await rsClient.close();
                  if (result.ok === 1) {
                    console.log('MongoDB replica set is ready');
                    process.exit(0);
                  }
                } catch (e) {
                  console.log('Waiting... (' + (i + 1) + '/30)');
                }
                await new Promise(r => setTimeout(r, 2000));
              }
              console.error('MongoDB replica set did not become ready');
              process.exit(1);
            })();
          "

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e
