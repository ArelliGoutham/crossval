name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27018:27017
        env:
          MONGO_INITDB_REPLICA_SET_NAME: rs0
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1}).ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27018/?replicaSet=rs0
      MONGODB_DB_NAME: crossval_ci
      APP_ORIGIN: http://localhost:3000
      SESSION_TTL_DAYS: '7'
      BCRYPT_COST: '12'
      BCRYPT_DUMMY_HASH: '$2b$12$6pXXnmXUHS4PXpEO6JeKFuq/7/7myFbHw9ZouzgxJK1YLAUNhx4wa'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Initialize MongoDB replica set
        run: |
          sleep 5
          mongosh --port 27018 --quiet --eval '
            try {
              rs.initiate({
                _id: "rs0",
                members: [{ _id: 0, host: "localhost:27017" }]
              });
            } catch (e) {
              print("Replica set may already be initiated: " + e.message);
            }
          ' || true

      - name: Wait for MongoDB replica set
        run: |
          for i in $(seq 1 30); do
            if mongosh --port 27018 --quiet --eval 'rs.status().ok' 2>/dev/null | grep -q '1'; then
              echo "MongoDB replica set is ready"
              exit 0
            fi
            echo "Waiting for MongoDB replica set... ($i/30)"
            sleep 2
          done
          echo "MongoDB replica set did not become ready"
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e
